{% if error %}
<div class="error">{{ _("Could not connect to Komga:") }} {{ error }}</div>
<select id="komga_library_id" name="komga_library_id">
  {% if selected %}
  <option value="{{ selected }}" selected>{{ _("Saved library") }} ({{ selected }})</option>
  {% else %}
  <option value="">{{ _("No library selected") }}</option>
  {% endif %}
</select>
{% else %}
<select id="komga_library_id" name="komga_library_id">
  {% if not libraries %}
  <option value="">{{ _("No libraries found") }}</option>
  {% endif %}
  {% for lib in libraries %}
  <option value="{{ lib.id }}" {% if lib.id == selected %}selected{% endif %}>{{ lib.name }}</option>
  {% endfor %}
</select>
{% endif %}
