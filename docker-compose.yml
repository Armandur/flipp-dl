services:
  flipp-dl:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data       # SQLite DB + config
      - ./output:/output   # downloaded PDFs
    environment:
      # Flipp API token – required.
      # Copy .env.example to .env and fill in FLIPP_TOKEN.
      FLIPP_TOKEN: "${FLIPP_TOKEN}"

      # Optional overrides (defaults match Dockerfile ENV)
      FLIPP_DB: "/data/flipp.db"
      FLIPP_OUTPUT: "/output"

      # Timezone used when rendering timestamps in the UI
      FLIPP_TZ: "${FLIPP_TZ:-Europe/Stockholm}"

      # Scheduler tuning
      FLIPP_POLL_INTERVAL: "${FLIPP_POLL_INTERVAL:-360}"
      FLIPP_WORKERS: "${FLIPP_WORKERS:-4}"

      # Web UI
      FLIPP_SECRET_KEY: "${FLIPP_SECRET_KEY:-change-me-in-production}"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
