; Alembic config for flipp-dl.
;
; At runtime the database URL is supplied programmatically by
; ``flipp_dl.db.session._ensure_schema`` – the ``sqlalchemy.url`` key
; below is only used when invoking the ``alembic`` CLI directly (e.g.
; ``alembic revision --autogenerate -m "..."``). Override it via
; ``-x db_url=sqlite:///flipp.db`` or edit it for local development.

[alembic]
script_location = flipp_dl/db/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///flipp.db
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
